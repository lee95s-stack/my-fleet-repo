apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-nginx-demo
spec:
  replicas: 4
  selector:
    matchLabels:
      app: fleet-nginx
  template:
    metadata:
      labels:
        app: fleet-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
